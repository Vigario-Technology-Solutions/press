name: Typst toolchain
description: >
  Install typst, just and optionally poppler, pinned to the versions the host
  that prints these documents runs.

inputs:
  poppler:
    description: Install poppler-utils, needed only by check's audit passes.
    default: "false"

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # Release binaries rather than apt. Ubuntu's `just` is old enough to lack
        # source_directory(), which press.just needs to locate itself when
        # vendored. Pin to what the host that prints these documents runs.
        TYPST_VERSION=0.15.1
        JUST_VERSION=1.57.0
        curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
          | sudo tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
        curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
          | sudo tar -xz -C /usr/local/bin just
        typst --version
        just --version

    - if: inputs.poppler == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # pdffonts and pdftotext, and poppler specifically — check asserts the
        # implementation, not the tool name.
        sudo apt-get update -qq
        sudo apt-get install -y -qq poppler-utils
        python3 --version
